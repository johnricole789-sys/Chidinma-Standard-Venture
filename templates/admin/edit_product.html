{% extends "admin/layout.html" %}

{% block page_title %}
Edit Product
{% endblock %}

{% block content %}

<div class="admin-page">

    <div class="admin-page-header">

        <div>
            <h1>Edit Product</h1>
            <p>Update your beverage product information.</p>
        </div>

    </div>


    <div class="admin-card edit-product-card">

        <form
            action="{{ url_for('main.edit_product', product_id=product.id) }}"
            method="POST"
            enctype="multipart/form-data"
            class="product-form"
        >

            <div class="form-group">

                <label>Product Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ product.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Category</label>

                <input
                    type="text"
                    name="category"
                    value="{{ product.category or '' }}"
                >

            </div>


            <div class="form-group">

                <label>Description</label>

                <textarea
                    name="description"
                    rows="5"
                >{{ product.description or '' }}</textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Price (₦)</label>

                    <input
                        type="number"
                        name="price"
                        value="{{ product.price }}"
                        step="0.01"
                        min="0"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Product Image</label>

                    <input
                        type="file"
                        name="image"
                        accept="image/*"
                    >

                </div>

            </div>


            {% if product.image %}

            <div class="current-image">

                <p>Current Image</p>

                <img
                    src="{{ url_for('static', filename='uploads/' + product.image) }}"
                    alt="{{ product.name }}"
                >

            </div>

            {% endif %}


            <div class="form-options">

                <label>

                    <input
                        type="checkbox"
                        name="featured"
                        {% if product.featured %}checked{% endif %}
                    >

                    Featured Product

                </label>


                <label>

                    <input
                        type="checkbox"
                        name="in_stock"
                        {% if product.in_stock %}checked{% endif %}
                    >

                    In Stock

                </label>

            </div>


            <div class="modal-actions">

                <a
                    href="{{ url_for('main.admin_products') }}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="admin-btn"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
